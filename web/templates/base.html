<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agroseed - Gestion de Lotes de Semillas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f5f5f0; }
        h1 { color: #2e7d32; }
        table { border-collapse: collapse; width: 100%; background-color: white; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #2e7d32; color: white; }
        .apto { color: #2e7d32; font-weight: bold; }
        .rechazado { color: #c62828; font-weight: bold; }
        .btn { padding: 6px 12px; background-color: #2e7d32; color: white; text-decoration: none; border: none; border-radius: 4px; cursor: pointer; }
        .btn-eliminar { background-color: #c62828; }
        form.inline { display: inline; }
    </style>
</head>
<body>
    <h1>Agroseed</h1>
    <p>Sistema de gestion de lotes de semillas</p>
    <hr>
    {% block contenido %}{% endblock %}
</body>
</html>
